name: Validate ImmoPilot

on:
  push:
    branches: [develop/accelerated]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML and inline JavaScript
        run: node tests/validate.mjs
