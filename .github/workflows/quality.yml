name: ImmoPilot quality checks

on:
  push:
    branches: [main, 'quality/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run application smoke tests
        run: node --test tests/smoke.test.mjs
